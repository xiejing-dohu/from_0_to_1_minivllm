<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="520" viewBox="0 0 1160 520" role="img" aria-labelledby="title desc"><title id="title">Decode PagedAttention address mapping</title><desc id="desc">A logical token position selects a logical block, a random physical block through the block table, and an offset in the KV cache.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#5e6c84"/></marker><style>.h{font:700 25px Arial;fill:#172b4d;text-anchor:middle}.t{font:700 15px Arial;fill:#172b4d;text-anchor:middle}.s{font:13px Arial;fill:#42526e;text-anchor:middle}.b{rx:11;ry:11;stroke-width:2}.e{fill:none;stroke:#5e6c84;stroke-width:2.2;marker-end:url(#a)}</style></defs><rect width="1160" height="520" fill="#fff"/><text class="h" x="580" y="38">Decode Query → Random Block Table → Paged KV Cache</text>
<rect class="b" x="35" y="115" width="180" height="100" fill="#e3f2fd" stroke="#1976d2"/><text class="t" x="125" y="148">one query / request</text><text class="s" x="125" y="174">[batch, Q heads, D]</text><text class="s" x="125" y="195">context_len = 10</text>
<rect class="b" x="285" y="95" width="225" height="140" fill="#f3e5f5" stroke="#8e24aa"/><text class="t" x="397" y="128">logical token position t</text><text class="s" x="397" y="157">logical_block = t // 4</text><text class="s" x="397" y="183">offset = t % 4</text><text class="s" x="397" y="210">only t &lt; context_len</text><path class="e" d="M215 165H285"/>
<rect class="b" x="285" y="315" width="225" height="105" fill="#fce4ec" stroke="#d81b60"/><text class="t" x="397" y="347">block_table</text><text class="s" x="397" y="375">logical [0, 1, 2]</text><text class="s" x="397" y="397">physical [7, 1, 5]</text><path class="e" d="M397 235V315"/>
<rect class="b" x="600" y="105" width="220" height="105" fill="#fff8e1" stroke="#f9a825"/><text class="t" x="710" y="138">physical address</text><text class="s" x="710" y="165">cache[physical_block,</text><text class="s" x="710" y="187">offset, KV head, :]</text><path class="e" d="M510 367H555V157H600"/>
<rect class="b" x="600" y="300" width="220" height="120" fill="#e8f5e9" stroke="#388e3c"/><text class="t" x="710" y="333">online softmax</text><text class="s" x="710" y="360">stream historical K/V</text><text class="s" x="710" y="384">Q head → shared KV head</text><text class="s" x="710" y="405">no cache rearrangement</text><path class="e" d="M710 210V300"/>
<rect class="b" x="915" y="300" width="190" height="120" fill="#e3f2fd" stroke="#1976d2"/><text class="t" x="1010" y="340">decode output</text><text class="s" x="1010" y="368">[batch, Q heads, D]</text><text class="s" x="1010" y="394">one vector / Q head</text><path class="e" d="M820 360H915"/></svg>
