<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="540" viewBox="0 0 1120 540" role="img" aria-labelledby="title desc">
  <title id="title">Mini vLLM end-to-end data flow</title>
  <desc id="desc">A prompt passes through the tokenizer, sequence, scheduler, and model runner into Qwen3. The model reads and writes paged KV cache, then sampling returns a new token to the scheduler.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#5e6c84"/></marker>
    <style>
      .box{rx:12;ry:12;stroke-width:2}.label{font:700 16px Arial,sans-serif;fill:#172b4d;text-anchor:middle}.sub{font:13px Arial,sans-serif;fill:#42526e;text-anchor:middle}.edge{fill:none;stroke:#5e6c84;stroke-width:2.2;marker-end:url(#arrow)}.edgeLabel{font:13px Arial,sans-serif;fill:#42526e;text-anchor:middle}.note{font:14px Arial,sans-serif;fill:#42526e}
    </style>
  </defs>
  <rect width="1120" height="540" fill="#fff"/>
  <text x="560" y="45" class="label" style="font-size:26px">Mini vLLM End-to-End Data Flow</text>
  <rect class="box" x="30" y="105" width="125" height="65" fill="#e3f2fd" stroke="#1976d2"/><text class="label" x="92" y="143">Prompt</text>
  <rect class="box" x="195" y="105" width="150" height="65" fill="#e8f5e9" stroke="#388e3c"/><text class="label" x="270" y="134">Tokenizer</text><text class="sub" x="270" y="154">encode / decode</text>
  <rect class="box" x="385" y="105" width="165" height="65" fill="#fff8e1" stroke="#f9a825"/><text class="label" x="467" y="134">Sequence</text><text class="sub" x="467" y="154">request and tokens</text>
  <rect class="box" x="590" y="105" width="180" height="65" fill="#fff3e0" stroke="#ef6c00"/><text class="label" x="680" y="134">Scheduler</text><text class="sub" x="680" y="154">Prefill / Decode</text>
  <rect class="box" x="810" y="105" width="210" height="65" fill="#f3e5f5" stroke="#8e24aa"/><text class="label" x="915" y="134">ModelRunner</text><text class="sub" x="915" y="154">prepare and execute</text>
  <rect class="box" x="815" y="275" width="195" height="75" fill="#ede7f6" stroke="#5e35b1"/><text class="label" x="912" y="307">Qwen3 Model</text><text class="sub" x="912" y="329">Layers → logits</text>
  <rect class="box" x="570" y="275" width="190" height="75" fill="#e0f7fa" stroke="#00838f"/><text class="label" x="665" y="307">Paged KV Cache</text><text class="sub" x="665" y="329">Block table + K/V blocks</text>
  <rect class="box" x="350" y="275" width="155" height="75" fill="#fce4ec" stroke="#d81b60"/><text class="label" x="427" y="307">Sampler</text><text class="sub" x="427" y="329">next token</text>
  <rect class="box" x="70" y="280" width="150" height="65" fill="#e3f2fd" stroke="#1976d2"/><text class="label" x="145" y="318">Text Output</text>
  <path class="edge" d="M155 137H195"/><path class="edge" d="M345 137H385"/><path class="edge" d="M550 137H590"/><path class="edge" d="M770 137H810"/><text class="edgeLabel" x="790" y="124">batch</text>
  <path class="edge" d="M915 170V275"/><path class="edge" d="M815 312H760"/><text class="edgeLabel" x="787" y="300">read / write</text>
  <path class="edge" d="M815 340V385H427V350"/><text class="edgeLabel" x="620" y="378">logits</text>
  <path class="edge" d="M427 275V220H680V170"/><text class="edgeLabel" x="520" y="212">next token</text>
  <path class="edge" d="M680 170V430H270V170"/><text class="edgeLabel" x="475" y="449">finished token ids</text>
  <path class="edge" d="M270 170V240H145V280"/>
  <rect x="285" y="455" width="550" height="58" rx="10" fill="#f7f9fc" stroke="#b3bac5"/>
  <text class="note" x="310" y="480">Engine: request state, scheduling, memory, and lifecycle</text><text class="note" x="310" y="501">Model: compute hidden states and logits for the current step</text>
</svg>
