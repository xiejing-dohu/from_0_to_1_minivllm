<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="430" viewBox="0 0 1160 430" role="img" aria-labelledby="title desc">
 <title id="title">Qwen3 decoder pre-norm residual flow</title><desc id="desc">The input bypasses RMSNorm and attention to the first addition; that result bypasses post-attention RMSNorm and MLP to the second addition.</desc>
 <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#5e6c84"/></marker><style>.h{font:700 25px Arial;fill:#172b4d;text-anchor:middle}.t{font:700 14px Arial;fill:#172b4d;text-anchor:middle}.s{font:12px Arial;fill:#42526e;text-anchor:middle}.b{rx:10;ry:10;stroke-width:2}.e{fill:none;stroke:#5e6c84;stroke-width:2;marker-end:url(#a)}.r{fill:none;stroke:#d81b60;stroke-width:2;stroke-dasharray:7 5;marker-end:url(#a)}</style></defs>
 <rect width="1160" height="430" fill="#fff"/><text class="h" x="580" y="38">Qwen3 Decoder: Correct Pre-norm Residual Flow</text>
 <rect class="b" x="25" y="180" width="120" height="75" fill="#e3f2fd" stroke="#1976d2"/><text class="t" x="85" y="211">hidden h0</text><text class="s" x="85" y="234">decoder input</text>
 <rect class="b" x="190" y="80" width="145" height="75" fill="#f3e5f5" stroke="#8e24aa"/><text class="t" x="262" y="111">input RMSNorm</text><text class="s" x="262" y="134">Norm(h0)</text>
 <rect class="b" x="375" y="80" width="155" height="75" fill="#fff8e1" stroke="#f9a825"/><text class="t" x="452" y="108">Self Attention</text><text class="s" x="452" y="131">QKV → Q/K Norm → RoPE</text>
 <circle cx="580" cy="217" r="24" fill="#fce4ec" stroke="#d81b60" stroke-width="2"/><text class="t" x="580" y="222">+</text>
 <path class="e" d="M145 195H165V117H190"/><path class="e" d="M335 117H375"/><path class="e" d="M530 117H580V193"/><path class="r" d="M145 230H556"/><text class="s" x="350" y="260">h1 = h0 + Attention(Norm(h0))</text>
 <rect class="b" x="650" y="80" width="155" height="75" fill="#f3e5f5" stroke="#8e24aa"/><text class="t" x="727" y="111">post RMSNorm</text><text class="s" x="727" y="134">Norm(h1)</text>
 <rect class="b" x="845" y="80" width="135" height="75" fill="#fff8e1" stroke="#f9a825"/><text class="t" x="912" y="108">MLP</text><text class="s" x="912" y="131">SiLU(gate) × up</text>
 <circle cx="1030" cy="217" r="24" fill="#fce4ec" stroke="#d81b60" stroke-width="2"/><text class="t" x="1030" y="222">+</text>
 <rect class="b" x="970" y="320" width="120" height="65" fill="#e8f5e9" stroke="#388e3c"/><text class="t" x="1030" y="347">hidden h2</text><text class="s" x="1030" y="368">decoder output</text>
 <path class="e" d="M604 205H625V117H650"/><path class="e" d="M805 117H845"/><path class="e" d="M980 117H1030V193"/><path class="r" d="M604 230H1006"/><path class="e" d="M1030 241V320"/><text class="s" x="805" y="260">h2 = h1 + MLP(Norm(h1))</text>
</svg>
