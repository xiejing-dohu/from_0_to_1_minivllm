<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="430" viewBox="0 0 1160 430" role="img"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#5e6c84"/></marker><style>.h{font:700 25px Arial;fill:#172b4d;text-anchor:middle}.t{font:700 16px Arial;fill:#172b4d;text-anchor:middle}.s{font:13px Arial;fill:#42526e;text-anchor:middle}.b{rx:14;ry:14;stroke-width:2}.e{fill:none;stroke:#5e6c84;stroke-width:2.2;marker-end:url(#a)}.p{fill:none;stroke:#d81b60;stroke-width:2.2;stroke-dasharray:7 5;marker-end:url(#a)}</style></defs><rect width="1160" height="430" fill="#fff"/><text class="h" x="580" y="38">Scheduler State Machine and Shared Budgets</text><rect class="b" x="80" y="160" width="210" height="110" fill="#fff8e1" stroke="#f9a825"/><text class="t" x="185" y="195">WAITING</text><text class="s" x="185" y="223">FIFO prompt queue</text><text class="s" x="185" y="248">reject impossible prompt</text><rect class="b" x="470" y="160" width="220" height="110" fill="#e3f2fd" stroke="#1976d2"/><text class="t" x="580" y="195">RUNNING</text><text class="s" x="580" y="223">Prefill or one Decode token</text><text class="s" x="580" y="248">token / seq / block budgets</text><rect class="b" x="870" y="160" width="210" height="110" fill="#e8f5e9" stroke="#388e3c"/><text class="t" x="975" y="195">FINISHED</text><text class="s" x="975" y="223">EOS / max tokens / length</text><text class="s" x="975" y="248">release every block</text><path class="e" d="M290 195H470"/><text class="s" x="380" y="183">allocate + Prefill</text><path class="e" d="M690 195H870"/><text class="s" x="780" y="183">stop condition</text><path class="p" d="M520 270V345H185V270"/><text class="s" x="350" y="366">cache pressure: preempt victim, deallocate, return to queue</text><path class="e" d="M640 270V315H740V215H690"/><text class="s" x="735" y="337">append if a new block is needed</text></svg>
