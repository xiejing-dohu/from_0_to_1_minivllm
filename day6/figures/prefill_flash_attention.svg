<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="540" viewBox="0 0 1160 540" role="img" aria-labelledby="title desc">
 <title id="title">Packed variable-length FlashAttention</title><desc id="desc">Cumulative lengths isolate packed sequences while query and key tiles update online softmax state without materializing the full attention matrix.</desc>
 <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#5e6c84"/></marker><style>.h{font:700 25px Arial;fill:#172b4d;text-anchor:middle}.t{font:700 15px Arial;fill:#172b4d;text-anchor:middle}.s{font:13px Arial;fill:#42526e;text-anchor:middle}.b{rx:11;ry:11;stroke-width:2}.e{fill:none;stroke:#5e6c84;stroke-width:2.2;marker-end:url(#a)}</style></defs>
 <rect width="1160" height="540" fill="#fff"/><text class="h" x="580" y="38">Packed Varlen Prefill → Triton FlashAttention</text>
 <rect class="b" x="40" y="105" width="210" height="105" fill="#e3f2fd" stroke="#1976d2"/><text class="t" x="145" y="137">packed Q / K / V</text><text class="s" x="145" y="163">lengths = [3, 5, 2]</text><text class="s" x="145" y="185">tokens = 10</text>
 <rect class="b" x="40" y="310" width="210" height="105" fill="#fce4ec" stroke="#d81b60"/><text class="t" x="145" y="342">cu_seqlens</text><text class="s" x="145" y="368">[0, 3, 8, 10]</text><text class="s" x="145" y="390">sequence boundaries</text>
 <rect class="b" x="335" y="190" width="210" height="145" fill="#f3e5f5" stroke="#8e24aa"/><text class="t" x="440" y="222">grid</text><text class="s" x="440" y="250">(query tile, Q head, seq)</text><text class="s" x="440" y="278">GQA: Q head → KV head</text><text class="s" x="440" y="306">causal + boundary masks</text>
 <path class="e" d="M250 157H295V225H335"/><path class="e" d="M250 362H295V300H335"/>
 <rect class="b" x="635" y="85" width="220" height="90" fill="#fff8e1" stroke="#f9a825"/><text class="t" x="745" y="117">load Q tile</text><text class="s" x="745" y="143">[BLOCK_M, head_dim]</text>
 <rect class="b" x="635" y="220" width="220" height="105" fill="#e8f5e9" stroke="#388e3c"/><text class="t" x="745" y="252">stream K/V tiles</text><text class="s" x="745" y="278">never save full N × N scores</text><text class="s" x="745" y="299">apply causal mask</text>
 <rect class="b" x="635" y="370" width="220" height="105" fill="#fce4ec" stroke="#d81b60"/><text class="t" x="745" y="402">online softmax state</text><text class="s" x="745" y="428">row_max, row_sum, acc</text><text class="s" x="745" y="449">rescale when max changes</text>
 <path class="e" d="M545 240H590V130H635"/><path class="e" d="M545 263H635"/><path class="e" d="M745 325V370"/>
 <rect class="b" x="935" y="220" width="175" height="105" fill="#e3f2fd" stroke="#1976d2"/><text class="t" x="1022" y="253">output</text><text class="s" x="1022" y="279">acc / row_sum</text><text class="s" x="1022" y="300">[10, Q heads, D]</text><path class="e" d="M855 422H900V272H935"/>
 </svg>
