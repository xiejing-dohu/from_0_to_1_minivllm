<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="610" viewBox="0 0 1160 610" role="img" aria-labelledby="title desc">
  <title id="title">Vocabulary-parallel embedding and LM head</title><desc id="desc">Token ids are masked by vocabulary shard, local embeddings are summed, the tied weights are reused by local LM heads, and logits are gathered to rank zero for sampling.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#5e6c84"/></marker><style>.h{font:700 25px Arial,sans-serif;fill:#172b4d;text-anchor:middle}.t{font:700 15px Arial,sans-serif;fill:#172b4d;text-anchor:middle}.s{font:13px Arial,sans-serif;fill:#42526e;text-anchor:middle}.b{rx:11;ry:11;stroke-width:2}.e{fill:none;stroke:#5e6c84;stroke-width:2.2;marker-end:url(#a)}.tie{fill:none;stroke:#d81b60;stroke-width:2;stroke-dasharray:7 5;marker-end:url(#a)}</style></defs>
  <rect width="1160" height="610" fill="#fff"/><text class="h" x="580" y="38">Vocab Parallel Embedding → Tied LM Head → Sampler</text>
  <rect class="b" x="35" y="120" width="145" height="75" fill="#e3f2fd" stroke="#1976d2"/><text class="t" x="107" y="150">token ids</text><text class="s" x="107" y="173">global vocabulary</text>
  <rect class="b" x="250" y="75" width="190" height="90" fill="#e8f5e9" stroke="#388e3c"/><text class="t" x="345" y="103">rank 0 mask</text><text class="s" x="345" y="127">ids [0, 4)</text><text class="s" x="345" y="146">weight A [4, H]</text>
  <rect class="b" x="250" y="200" width="190" height="90" fill="#fff8e1" stroke="#f9a825"/><text class="t" x="345" y="228">rank 1 mask</text><text class="s" x="345" y="252">ids [4, 7]</text><text class="s" x="345" y="271">weight B + zero pad row</text>
  <rect class="b" x="520" y="125" width="175" height="90" fill="#f3e5f5" stroke="#8e24aa"/><text class="t" x="607" y="158">all_reduce SUM</text><text class="s" x="607" y="183">full embeddings</text><text class="s" x="607" y="202">[..., H]</text>
  <rect class="b" x="790" y="125" width="160" height="90" fill="#e3f2fd" stroke="#1976d2"/><text class="t" x="870" y="158">Transformer</text><text class="s" x="870" y="183">hidden states</text><text class="s" x="870" y="202">[B, H]</text>
  <path class="e" d="M180 145H215V120H250"/><path class="e" d="M180 170H215V245H250"/><path class="e" d="M440 120H480V150H520"/><path class="e" d="M440 245H480V190H520"/><path class="e" d="M695 170H790"/>
  <line x1="35" y1="330" x2="1125" y2="330" stroke="#dfe1e6" stroke-width="2"/>
  <rect class="b" x="75" y="390" width="175" height="90" fill="#e8f5e9" stroke="#388e3c"/><text class="t" x="162" y="422">rank 0 LM head</text><text class="s" x="162" y="447">local logits [B, 4]</text><text class="s" x="162" y="466">reuses weight A</text>
  <rect class="b" x="75" y="500" width="175" height="80" fill="#fff8e1" stroke="#f9a825"/><text class="t" x="162" y="526">rank 1 LM head</text><text class="s" x="162" y="549">local logits [B, 4]</text><text class="s" x="162" y="568">reuses weight B</text>
  <rect class="b" x="360" y="430" width="175" height="90" fill="#f3e5f5" stroke="#8e24aa"/><text class="t" x="447" y="462">gather to rank 0</text><text class="s" x="447" y="487">[B, padded_vocab]</text><text class="s" x="447" y="506">trim to vocab = 7</text>
  <rect class="b" x="650" y="430" width="175" height="90" fill="#fce4ec" stroke="#d81b60"/><text class="t" x="737" y="462">temperature</text><text class="s" x="737" y="487">softmax + sample</text><text class="s" x="737" y="506">one token / request</text>
  <rect class="b" x="940" y="440" width="145" height="70" fill="#e3f2fd" stroke="#1976d2"/><text class="t" x="1012" y="471">next token ids</text><text class="s" x="1012" y="493">[B]</text>
  <path class="e" d="M250 435H360"/><path class="e" d="M250 540H315V495H360"/><path class="e" d="M535 475H650"/><path class="e" d="M825 475H940"/>
  <text class="s" x="162" y="355">same-rank tied Parameters (A / B)</text>
</svg>
