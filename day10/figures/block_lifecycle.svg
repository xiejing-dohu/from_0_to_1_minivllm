<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="500" viewBox="0 0 1160 500" role="img" aria-labelledby="title desc">
 <title id="title">Sequence and physical block lifecycle</title><desc id="desc">Full prefix blocks may be shared after hash and token verification, while partial blocks are newly allocated; deallocation decrements every referenced block.</desc>
 <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#5e6c84"/></marker><style>.h{font:700 25px Arial;fill:#172b4d;text-anchor:middle}.t{font:700 15px Arial;fill:#172b4d;text-anchor:middle}.s{font:13px Arial;fill:#42526e;text-anchor:middle}.b{rx:11;ry:11;stroke-width:2}.e{fill:none;stroke:#5e6c84;stroke-width:2.2;marker-end:url(#a)}.r{fill:none;stroke:#d81b60;stroke-width:2;stroke-dasharray:7 5;marker-end:url(#a)}</style></defs>
 <rect width="1160" height="500" fill="#fff"/><text class="h" x="580" y="38">Sequence → Logical Blocks → Shared Physical KV Blocks</text>
 <rect class="b" x="35" y="100" width="210" height="120" fill="#e3f2fd" stroke="#1976d2"/><text class="t" x="140" y="132">Sequence A</text><text class="s" x="140" y="158">tokens [1,2,3,4 | 9]</text><text class="s" x="140" y="182">block_table [2,5]</text><text class="s" x="140" y="204">cached_tokens = 0</text>
 <rect class="b" x="35" y="300" width="210" height="120" fill="#fff8e1" stroke="#f9a825"/><text class="t" x="140" y="332">Sequence B</text><text class="s" x="140" y="358">tokens [1,2,3,4 | 8]</text><text class="s" x="140" y="382">block_table [2,7]</text><text class="s" x="140" y="404">cached_tokens = 4</text>
 <rect class="b" x="345" y="165" width="250" height="170" fill="#fce4ec" stroke="#d81b60"/><text class="t" x="470" y="198">allocate / prefix lookup</text><text class="s" x="470" y="226">full block: hash(prefix, tokens)</text><text class="s" x="470" y="252">hit + token equality → share</text><text class="s" x="470" y="278">miss or partial → allocate new</text><text class="s" x="470" y="306">claiming sets/increments ref_count</text>
 <path class="e" d="M245 160H295V215H345"/><path class="e" d="M245 360H295V285H345"/>
 <rect class="b" x="690" y="70" width="220" height="120" fill="#e8f5e9" stroke="#388e3c"/><text class="t" x="800" y="103">physical block 2</text><text class="s" x="800" y="130">tokens [1,2,3,4]</text><text class="s" x="800" y="154">ref_count = 2</text><text class="s" x="800" y="176">verified shared prefix</text>
 <rect class="b" x="690" y="215" width="220" height="90" fill="#e3f2fd" stroke="#1976d2"/><text class="t" x="800" y="247">physical block 5</text><text class="s" x="800" y="275">new partial block [9]</text>
 <rect class="b" x="690" y="335" width="220" height="90" fill="#fff8e1" stroke="#f9a825"/><text class="t" x="800" y="367">physical block 7</text><text class="s" x="800" y="395">new partial block [8]</text>
 <path class="e" d="M595 215H640V130H690"/><path class="e" d="M595 250H690"/><path class="e" d="M595 285H640V380H690"/>
 <rect class="b" x="975" y="165" width="155" height="170" fill="#f3e5f5" stroke="#8e24aa"/><text class="t" x="1052" y="198">deallocate</text><text class="s" x="1052" y="226">for every block</text><text class="s" x="1052" y="252">ref_count − 1</text><text class="s" x="1052" y="278">zero → free list</text><text class="s" x="1052" y="306">full cache metadata kept</text>
 <path class="r" d="M910 130H940V205H975"/><path class="r" d="M910 260H975"/><path class="r" d="M910 380H940V295H975"/>
</svg>
